# Same hook as an app's source build. The shared workflow publishes immutable
# GitHub release files and pushes kiln-manifest/<tag>; merge that manifest
# branch before publishing a package version. kiln-release-dry uploads nothing.
name: Kiln release
run-name: Kiln release / ${{ (github.ref_name == 'kiln-release-dry' || inputs.dry_run) && 'build only' || 'publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, upload nothing.
        type: boolean
        default: false
  push:
    branches: [kiln-release, kiln-release-dry]

permissions:
  contents: read

jobs:
  kiln-release:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_release.yml@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
    permissions:
      contents: write
    with:
      dry-run: ${{ inputs.dry_run == true }}
      # Desktop automation only. Mobile and web use the existing Dart stubs.
      targets: >-
        ["windows-x64", "windows-arm64", "linux-x64", "linux-arm64",
        "macos-arm64", "macos-x64"]
      build-args: '{"macos-*": ["--macos-version", "12"]}'
