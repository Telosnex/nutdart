name: nutdart
description: "Automation plugin for Flutter desktop applications built on libnut-core"
version: 1.0.0
homepage: https://github.com/Telosnex/nutdart

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  code_assets: ^2.2.0
  dbus: ^0.8.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  kiln: ^1.0.0
  logging: ^1.3.0
  native_toolchain_cmake: ^0.3.2

dev_dependencies:
  ffigen: ^19.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
