name: portal
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - run: flutter pub get
      # I3: the Linux code starts no process.
      - run: flutter test test/no_process_spawn_test.dart
      - run: flutter test test/portal_computer_use_test.dart test/portal_png_pixels_test.dart
