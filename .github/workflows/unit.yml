name: Unit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - uses: Telosnex/telosnex_ci_tools/actions/lint@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get --no-example
      - run: dart tool/kiln/prepare.dart
      - run: sudo apt-get install -y -qq libxkbcommon0 xkb-data
      - run: dart format --output=none --set-exit-if-changed lib test hook tool
      - run: dart analyze --fatal-infos lib test hook tool
      # A source change requires a matching native release before merge.
      - run: dart run kiln:check --download
      - run: flutter test --reporter expanded
