name: portal
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  # Same pins as Telosnex warpbuild_unit_tests.yml.
  FLUTTER_VERSION: '3.47.1'
  FLUTTER_FRAMEWORK_REVISION: 6655482ec06e547f90abf8ae7590466f4415978d
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Copy of Telosnex .github/actions/setup-linux-flutter.
      - name: Set up pinned Linux x64 Flutter SDK
        uses: ./.github/actions/setup-linux-flutter
        with:
          architecture: x64
          sdk-path: ${{ runner.temp }}/flutter-${{ env.FLUTTER_VERSION }}-x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
          framework-revision: ${{ env.FLUTTER_FRAMEWORK_REVISION }}
      - run: flutter pub get
      # I3: the Linux code starts no process.
      - run: flutter test test/no_process_spawn_test.dart
      - run: flutter test test/portal_computer_use_test.dart test/portal_png_pixels_test.dart
  # Real GNOME desktop, headless: consent, typing, refusals, stop.
  # See tool/ci/gnome/run.sh.
  gnome-desktop:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install headless GNOME and portals
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell mutter xdg-desktop-portal xdg-desktop-portal-gnome \
            pipewire wireplumber dbus-bin dbus-daemon at-spi2-core \
            python3-gi gir1.2-gtk-4.0 gir1.2-atspi-2.0 xkb-data \
            gsettings-desktop-schemas
      - name: Set up pinned Linux x64 Flutter SDK
        uses: ./.github/actions/setup-linux-flutter
        with:
          architecture: x64
          sdk-path: ${{ runner.temp }}/flutter-${{ env.FLUTTER_VERSION }}-x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
          framework-revision: ${{ env.FLUTTER_FRAMEWORK_REVISION }}
      - run: flutter pub get
      - name: Approve, type, refuse missing characters, stop
        run: tool/ci/gnome/run.sh type
      - name: Approve with remote interaction off (I1)
        run: tool/ci/gnome/run.sh no-interaction
      - name: Deny (I1)
        run: tool/ci/gnome/run.sh deny
      - name: Desktop logs
        if: failure()
        run: tail -n 80 /tmp/nutdart-gnome-ci/*.log
